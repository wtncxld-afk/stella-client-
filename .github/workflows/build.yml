name: Build Stella Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon -Pmod_version=1.0.${{ github.run_number }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: stella-client-jar
          path: build/libs/*.jar
          if-no-files-found: error

  smoke-test:
    # Boots the real Minecraft client under a virtual display, force-applies
    # every mixin (MixinEnvironment.audit), renders the ClickGUI, HUD editor and
    # an in-world frame, then exits. Fails if the marker line is missing.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils ffmpeg
      - name: Run smoke test (recorded)
        run: |
          chmod +x gradlew
          export LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          touch smoke.log
          # Start recording once the game window is up, so the video skips the Gradle/loading phase.
          ( until grep -q "Stella Client ready" smoke.log; do sleep 1; done
            exec ffmpeg -loglevel error -f x11grab -video_size 1280x720 -framerate 15 -i :99 \
              -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p preview-raw.mp4 ) &
          REC=$!
          timeout 1500 ./gradlew runSmoke --no-daemon 2>&1 | tee smoke.log || true
          pkill -INT -f "ffmpeg.*x11grab" || true
          wait $REC || true
          ls -la preview-raw.mp4 || true
          grep -q "STELLA_SMOKE_OK" smoke.log
      - name: Upload preview video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stella-preview-video
          path: preview-raw.mp4
          if-no-files-found: ignore
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stella-screenshots
          path: run-smoke/screenshots/
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            smoke.log
            run-smoke/logs/latest.log
            run-smoke/crash-reports/

  screenshot-preview:
    # Re-encodes the smoke-test screenshots as small JPEGs and prints them as
    # base64 so they can be retrieved from the job log by tools without
    # artifact-storage access. Safe to delete.
    needs: smoke-test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stella-screenshots
          path: shots
      - name: Print screenshots
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, os
          from PIL import Image
          for f in sorted(os.listdir('shots')):
              if not f.endswith('.png'): continue
              im = Image.open(os.path.join('shots', f)).convert('RGB')
              buf = io.BytesIO(); im.save(buf, 'JPEG', quality=82)
              b = base64.b64encode(buf.getvalue()).decode()
              print(f'SHOT_BEGIN {f}')
              for i in range(0, len(b), 4000): print('SHOT ' + b[i:i+4000])
              print(f'SHOT_END {f}')
          PY

  video-preview:
    # Shrinks the recorded smoke-test video and prints it as base64 so it can be
    # retrieved from the job log. Safe to delete.
    needs: smoke-test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stella-preview-video
          path: vid
      - name: Print video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -loglevel error -i vid/preview-raw.mp4 -vf "scale=960:-2,fps=15" -c:v libx264 -preset slow -crf 30 -an -movflags +faststart preview.mp4
          ls -la preview.mp4
          echo "VID_SHA256 $(sha256sum preview.mp4 | cut -d' ' -f1)"
          base64 -w 4000 preview.mp4 | sed 's/^/VID /'
          echo "VID_END"

  jar-audit:
    # Security audit of the exact jar the build job produced:
    # SHA-256, full file listing, bytecode scan for network / process /
    # class-loading calls, ClamAV antivirus scan, then the jar printed as
    # base64 so it can be verified and delivered byte-for-byte.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stella-client-jar
          path: jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Hash and list contents
        run: |
          cd jar
          sha256sum *.jar
          for j in *.jar; do echo "== $j"; unzip -l "$j"; done
      - name: Bytecode scan
        run: |
          J=$(ls jar/*.jar | grep -v sources)
          mkdir x && cd x && unzip -q "../$J"
          find . -name '*.class' > classes.txt
          echo "classes: $(wc -l < classes.txt)"
          echo "== classes referencing network / process / classloading / reflection APIs"
          for c in $(cat classes.txt); do
            hits=$(javap -c -p "$c" 2>/dev/null | grep -oE 'java/net/[A-Za-z/]+|java/lang/ProcessBuilder|java/lang/Runtime\.exec|java/lang/ClassLoader|java/net/URLClassLoader|defineClass|java/lang/reflect/[A-Za-z]+|sun/misc/Unsafe|java/util/Base64|javax/script' | sort -u | tr '\n' ' ')
            [ -n "$hits" ] && echo "$c: $hits"
          done
          echo "== end of bytecode scan"
      - name: ClamAV scan
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || sudo freshclam
          clamscan --scan-archive=yes -r jar/ | tee clamscan.txt
          grep -q "Infected files: 0" clamscan.txt
      - name: Export jar (base64)
        run: |
          J=$(ls jar/*.jar | grep -v sources)
          echo "JAR_NAME $(basename $J)"
          echo "JAR_SHA256 $(sha256sum $J | cut -d' ' -f1)"
          base64 -w 4000 "$J" | sed 's/^/JAR /'
          echo "JAR_END"

  release:
    # Publishes the audited jar as a GitHub Release (tag v1.0.<run number>) with
    # its SHA-256. The in-game Auto Updater reads releases/latest, downloads the
    # jar, checks the hash and installs it when Minecraft closes. Only runs on
    # pushes to the release branches, and only after the build, the in-game
    # smoke test and the malware audit have all passed.
    needs: [build, smoke-test, jar-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/stella-client-fabric-mod-1i9iw2')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stella-client-jar
          path: jar
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=1.0.${{ github.run_number }}
          J=jar/stella-client-$V.jar
          test -f "$J"
          (cd jar && sha256sum "stella-client-$V.jar" > "stella-client-$V.jar.sha256")
          cat "$J.sha256"
          gh release create "v$V" "$J" "$J.sha256" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Stella Client $V (Minecraft 1.21.11)" \
            --notes "Automatic build of ${{ github.sha }}. Passed the in-game smoke test and the jar audit (bytecode scan + ClamAV). SHA-256: $(cut -d' ' -f1 "$J.sha256")"
