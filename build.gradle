plugins {
    id 'fabric-loom' version '1.13.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    runs {
        // Headless CI smoke test: boots the client, force-applies every mixin,
        // opens the ClickGUI and HUD editor, then exits. See StellaSmokeTest.
        smoke {
            client()
            name = 'Smoke Test Client'
            vmArg '-Dstella.smokeTest=true'
            programArgs '--width', '1280', '--height', '720'
            runDir 'run-smoke'
        }
    }
}

// "1.21.11+build.+" in gradle.properties means "newest Yarn build for this Minecraft
// version"; Loom needs an exact version, so ask Fabric's meta API which one that is.
def resolveYarn = { String v ->
    if (!v.endsWith('+')) return v
    def mc = project.minecraft_version
    def json = new groovy.json.JsonSlurper().parse(new URL("https://meta.fabricmc.net/v2/versions/yarn/${mc}"))
    def latest = json.max { it.build }.version
    logger.lifecycle("Using Yarn ${latest}")
    return latest
}
def yarnVersion = resolveYarn(project.yarn_mappings)

// "latest" in gradle.properties means the newest stable Fabric Loader (so the dev/test client runs the
// same loader current mods such as ImmediatelyFast need). Falls back to loader_min if offline.
def resolveLoader = { String v ->
    if (v != 'latest') return v
    try {
        def json = new groovy.json.JsonSlurper().parse(new URL("https://meta.fabricmc.net/v2/versions/loader"))
        def stable = json.find { it.stable }?.version
        logger.lifecycle("Using Fabric Loader ${stable}")
        return stable ?: project.loader_min
    } catch (Exception e) {
        logger.warn("Could not reach Fabric meta, using loader ${project.loader_min}")
        return project.loader_min
    }
}
def loaderVersion = resolveLoader(project.loader_version)

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${yarnVersion}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_min', project.loader_min
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version,
               'loader_version': project.loader_min
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release.set(targetJavaVersion)
    it.options.compilerArgs += ['-Xlint:deprecation', '-Xmaxerrs', '5000']
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Prints the compile classpath (used by the CI code-quality job so SpotBugs can resolve Minecraft classes)
tasks.register('printClasspath') {
    doLast { println 'STELLA_CLASSPATH ' + sourceSets.main.compileClasspath.asPath }
}
